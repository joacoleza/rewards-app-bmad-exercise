name: story-pipeline
description: >
  Creates a story file and then immediately develops it.
  Runs create-story and dev-story serially with automatic handoff.

sequence:
  # Step 1: Scrum Master creates the story
  - step: create-story
    agent: sm
    action: create-story
    isolation: subagent
    description: >
      Draft a new story file from the next item in the backlog.
    outputs:
      - story-file

  # Step 2: Scrum Master marks the story as ready for dev
  - step: story-ready
    agent: sm
    action: story-ready
    isolation: subagent
    description: >
      Review and approve the drafted story, confirming acceptance
      criteria, technical notes, and scope are complete.
    dependencies:
      - story-file
    outputs:
      - approved-story

  # Step 3: Developer implements the approved story
  - step: dev-story
    agent: dev
    action: dev-story
    isolation: subagent
    description: >
      Implement the approved story following the architecture,
      project context, and story acceptance criteria.
    dependencies:
      - approved-story
    outputs:
      - implemented-story

  # Step 4: Code review on the implemented story
  - step: code-review
    agent: dev
    action: code-review
    isolation: subagent
    description: >
      Run adversarial code review across multiple quality facets
      on the implemented story changes. Runs in an isolated
      sub-agent context to avoid bias from the implementation step.
    dependencies:
      - implemented-story
    outputs:
      - reviewed-story

  # Step 5: QA verifies acceptance criteria with automated tests
  - step: qa-verify
    agent: qa
    action: qa-generate-e2e-tests
    isolation: subagent
    description: >
      Generate and run automated tests validating the story's
      acceptance criteria. Covers happy-path and critical edge
      cases. Tests must pass before the story can be marked done.
    dependencies:
      - reviewed-story
    outputs:
      - verified-story

  # Step 6: Developer marks story as complete
  - step: story-done
    agent: dev
    action: story-approved
    isolation: subagent
    description: >
      Mark the story as done after all acceptance criteria are met,
      code review is passed, and QA verification succeeds.
    dependencies:
      - verified-story
